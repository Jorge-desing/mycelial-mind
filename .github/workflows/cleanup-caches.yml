name: Cleanup Actions Caches

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Eliminar cachés sin acceso en más de N días'
        required: false
        default: '7'
        type: string

permissions:
  actions: write

concurrency:
  group: cleanup-caches
  cancel-in-progress: false

jobs:
  prune:
    name: Prune stale Actions caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete stale caches
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '7' }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${MAX_AGE_DAYS} days ago" +"%Y-%m-%dT%H:%M:%SZ")
          echo "Pruning caches last accessed before ${cutoff}..."
          ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches" \
            --jq ".actions_caches[] | select(.last_accessed_at < \"${cutoff}\") | .id")
          count=0
          for id in ${ids}; do
            echo "Deleting cache ${id}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}"
            count=$((count + 1))
          done
          echo "Deleted ${count} stale cache(s)."
