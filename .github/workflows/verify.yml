name: Verify Mycelial Mind

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automation-config:
    name: Validate automation config
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44.257.9 -- renovate-config-validator --no-global --strict

  assets:
    name: Asset checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.9'
          enable-cache: true
      - name: Verify models, textures, and particles
        run: ./scripts/Verify-Assets.ps1
      - name: Confirm checks leave versioned files intact
        run: git diff --exit-code HEAD

  gradle:
    name: Build and GameTests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
      - name: Run JUnit, build, GameTests, and release dry-run
        id: gradle-verification
        run: |
          ./gradlew.bat --console=plain --max-workers=2 test build runGameTestServer publishMods -PpublishDryRun=true 2>&1 |
            Tee-Object -FilePath gradle-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path gradle-ci.log -Pattern 'All [1-9][0-9]* required tests passed' -Quiet)) {
            throw 'NeoForge did not report that the required GameTests passed.'
          }
          if (-not (Select-String -Path gradle-ci.log -Pattern 'Dry run publishGithub' -Quiet)) {
            throw 'Mod Publish did not report the expected release dry-run.'
          }
      - name: Release Gradle cache locks on Windows
        if: always() && steps.gradle-verification.outcome != 'skipped'
        continue-on-error: true
        run: ./gradlew.bat --stop
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gradle-verification
          path: |
            gradle-ci.log
            build/test-results/test/
            build/reports/tests/test/
