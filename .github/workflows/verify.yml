name: Verify Mycelial Mind

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'MEMORY.md'
      - 'AGENTS.md'
      - 'GEMINI.md'
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - '.agents/**'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  automation-config:
    name: Validate automation config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44.257.9 -- renovate-config-validator --no-global --strict

  assets:
    name: Asset checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: true
      - name: Verify models, textures, and particles
        run: ./scripts/Verify-Assets.ps1
      - name: Confirm checks leave versioned files intact
        run: git diff --exit-code HEAD

  gradle:
    name: Build and GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
      - name: Run JUnit, build, GameTests, and release dry-run
        id: gradle-verification
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --console=plain --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2G test build runGameTestServer publishMods -PpublishDryRun=true 2>&1 | tee gradle-ci.log
          grep -Eq 'All [1-9][0-9]* required tests passed' gradle-ci.log
          grep -Fq 'Dry run publishGithub' gradle-ci.log
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gradle-verification
          retention-days: 7
          path: |
            gradle-ci.log
            build/test-results/test/
            build/reports/tests/test/
