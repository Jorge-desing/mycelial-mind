name: Release Mycelial Mind

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release (ej. v2.0.0; si se omite usa v<mod_version>)'
        required: false
        type: string
      draft:
        description: 'Crear la release como borrador (Draft)'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Marcar como pre-release'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, verify and draft GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic

      - name: Run verification and build mod JAR
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --console=plain --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2G test build runGameTestServer 2>&1 | tee gradle-release.log
          grep -Eq 'All [1-9][0-9]* required tests passed' gradle-release.log

      - name: Prepare release metadata and checksums
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          mod_version=$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          mc_version=$(grep -E '^minecraft_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          neo_version=$(grep -E '^neo_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            draft="true"
            prerelease="false"
            if [[ "${tag}" == *-* ]]; then
              prerelease="true"
            fi
          else
            tag="${{ inputs.tag }}"
            if [ -z "${tag}" ]; then
              tag="v${mod_version}"
            fi
            draft="${{ inputs.draft }}"
            prerelease="${{ inputs.prerelease }}"
          fi

          jar_path=$(find build/libs -maxdepth 1 -type f -name 'mycelialmind-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          if [ -z "${jar_path}" ] || [ ! -f "${jar_path}" ]; then
            echo "Mod JAR not found in build/libs" >&2
            exit 1
          fi

          sha256sum "${jar_path}" > "${jar_path}.sha256"

          {
            echo "tag=${tag}"
            echo "title=Mycelial Mind ${tag} (MC ${mc_version} / NeoForge ${neo_version})"
            echo "jar_path=${jar_path}"
            echo "sha_path=${jar_path}.sha256"
            echo "draft=${draft}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            release create "${{ steps.meta.outputs.tag }}"
            "${{ steps.meta.outputs.jar_path }}"
            "${{ steps.meta.outputs.sha_path }}"
            --title "${{ steps.meta.outputs.title }}"
            --generate-notes
            --target "${GITHUB_SHA}"
          )
          if [ "${{ steps.meta.outputs.draft }}" = "true" ]; then
            args+=(--draft)
          fi
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
